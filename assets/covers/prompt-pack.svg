<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" style="stop-color:#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="500" cy="150" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="60"/>
  <circle cx="-100" cy="700" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="80"/>
  <circle cx="450" cy="650" r="80" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="3"/>

  <!-- Dots pattern -->
  <circle cx="100" cy="200" r="3" fill="#ffffff" opacity="0.2"/>
  <circle cx="150" cy="220" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="120" cy="250" r="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="480" cy="180" r="3" fill="#ffffff" opacity="0.2"/>
  <circle cx="520" cy="210" r="2" fill="#ffffff" opacity="0.15"/>

  <!-- AI Icon -->
  <rect x="250" y="80" width="100" height="100" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  <text x="300" y="148" font-family="Arial, sans-serif" font-size="48" fill="#fbbf24" text-anchor="middle">🤖</text>

  <!-- Title -->
  <text x="300" y="260" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Prompt Pack</text>
  <text x="300" y="300" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">50+</text>

  <!-- Subtitle -->
  <text x="300" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7d2fe" text-anchor="middle">สูตรใช้ AI ทำงาน</text>

  <!-- Divider -->
  <rect x="200" y="380" width="200" height="3" rx="2" fill="url(#accent)"/>

  <!-- Features -->
  <text x="300" y="430" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">✦ สำหรับ ChatGPT · Claude · Gemini</text>
  <text x="300" y="465" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">✦ ภาษาไทย 100% · พร้อมใช้ทันที</text>
  <text x="300" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a5b4fc" text-anchor="middle">✦ ครอบคลุมทุกสายงาน</text>

  <!-- Price tag -->
  <rect x="220" y="560" width="160" height="50" rx="25" fill="url(#accent)"/>
  <text x="300" y="592" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1e1b4b" text-anchor="middle">$5.99</text>

  <!-- Bottom text -->
  <text x="300" y="680" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6366f1" text-anchor="middle">thaitools.site</text>

  <!-- Decorative line bottom -->
  <rect x="150" y="720" width="300" height="1" fill="#ffffff" opacity="0.1"/>
</svg>
