<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="135%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="520" cy="120" r="250" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="40"/>
  <circle cx="-80" cy="750" r="300" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="60"/>
  <circle cx="480" cy="680" r="60" fill="none" stroke="#fda085" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="700" x2="600" y2="700"/>
  </g>

  <!-- Logo area -->
  <rect x="240" y="70" width="120" height="120" rx="24" fill="url(#card)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="300" y="147" font-family="Arial, sans-serif" font-size="52" text-anchor="middle" fill="#f6d365">⚡</text>

  <!-- Main title -->
  <text x="300" y="240" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#fda085" text-anchor="middle" letter-spacing="4">PREMIUM PROMPTS</text>

  <text x="300" y="300" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">Prompt Pack</text>
  <text x="300" y="355" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="url(#gold)" text-anchor="middle">50+</text>

  <!-- Divider -->
  <rect x="220" y="390" width="160" height="3" rx="2" fill="url(#gold)"/>

  <!-- Features -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b8b8d4">
    <circle cx="200" cy="440" r="3" fill="#fda085"/>
    <text x="215" y="444">For ChatGPT, Claude &amp; Gemini</text>

    <circle cx="200" cy="475" r="3" fill="#fda085"/>
    <text x="215" y="479">Ready to use — copy &amp; paste</text>

    <circle cx="200" cy="510" r="3" fill="#fda085"/>
    <text x="215" y="514">5 categories, 50+ prompts</text>

    <circle cx="200" cy="545" r="3" fill="#fda085"/>
    <text x="215" y="549">Instant PDF download</text>
  </g>

  <!-- Price tag -->
  <rect x="220" y="600" width="160" height="54" rx="27" fill="url(#gold)"/>
  <text x="300" y="634" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0f0c29" text-anchor="middle">$7.99</text>

  <!-- Bottom -->
  <text x="300" y="720" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6366f1" text-anchor="middle" letter-spacing="2">THAITOOLS.STORE</text>
  <rect x="200" y="740" width="200" height="1" fill="rgba(255,255,255,0.08)"/>
</svg>
